# Quando fotos novas chegam em fotos/<ensaio>/, reduz para a web, atualiza a
# galeria (src/content/photo-gallery.json) e apaga os originais. Ver fotos/LEIA-ME.md.
name: Processar fotos

on:
  push:
    paths:
      - 'fotos/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fotos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fotos
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fotos public/images/fotografia src/content/photo-gallery.json
          if git diff --cached --quiet; then
            echo "Nenhuma foto nova."
            exit 0
          fi
          git commit -m "Adicionar fotos à galeria"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
